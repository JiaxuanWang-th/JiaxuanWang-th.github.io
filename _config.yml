# Basic Information
# 填写后保存，推送到 GitHub 即可生效
title: Your Name
position: Your Position
affiliation: Your Affiliation
email: yourname (at) example.edu
# chinese_name: 你的中文名   # 可选

# Search Engine Optimization (SEO)
keywords: JiaxuanWang-th, personal homepage
description: Personal homepage of JiaxuanWang-th.
canonical: https://jiaxuanwang-th.github.io/

# Links
# 不需要的链接整行删除即可
# google_scholar: https://scholar.google.com/
# cv_link: assets/files/curriculum_vitae.pdf
github_link: https://github.com/JiaxuanWang-th
# linkedin: https://www.linkedin.com/
# twitter: https://twitter.com/

# Images
# 把头像放到 assets/img/ 后改这里的文件名
avatar: ./assets/img/avatar.png
favicon: ./assets/img/favicon.png
favicon_dark: ./assets/img/favicon-dark.png

# Footnote
enable_footnote: true

# Auto Dark Mode
auto_dark_mode: true

# Font: "Serif" or "Sans Serif"
font: "Serif"

# Google Analytics ID（不用就保持注释）
# google_analytics: G-XXXXXXXXXX

# GitHub Pages remote theme
remote_theme: yaoyao-liu/minimal-light

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README_zh_Hans.md
  - README_zh_Hant.md
  - README_de.md
  - LICENSE
  - minimal-light.gemspec
  - html_source_file/
